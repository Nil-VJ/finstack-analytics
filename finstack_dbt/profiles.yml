# Committed on purpose: no secrets here, only env_var() lookups.
# Pick the target with DBT_TARGET (dev | ci | prod); the key file path comes from DBT_KEYFILE.
finstack_dbt:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'finstack-analytics') }}"
      dataset: finstack_dev
      keyfile: "{{ env_var('DBT_KEYFILE', '../credentials/service_account.json') }}"
      location: EU
      threads: 4
    ci:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'finstack-analytics') }}"
      dataset: finstack_ci
      keyfile: "{{ env_var('DBT_KEYFILE', '../credentials/service_account.json') }}"
      location: EU
      threads: 4
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'finstack-analytics') }}"
      dataset: finstack_analytics
      keyfile: "{{ env_var('DBT_KEYFILE', '../credentials/service_account.json') }}"
      location: EU
      threads: 4
