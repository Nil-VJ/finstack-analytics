models:
  - name: stg_prices
    description: "Daily adjusted prices with snake_case names and explicit types; rows without a close are dropped. Grain: one row per ticker per trading date."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, date]
    columns:
      - name: ticker
        description: "{{ doc('ticker_description') }}"
      - name: date
        description: "Trading date"
      - name: open_price
        description: "Adjusted opening price"
      - name: high_price
        description: "Adjusted daily high"
      - name: low_price
        description: "Adjusted daily low"
      - name: close_price
        description: "{{ doc('close_price_description') }}"
      - name: volume
        description: "Shares traded"
      - name: _loaded_at
        description: "UTC timestamp of the load that wrote the row"

  - name: stg_company_info
    description: "Company profile with explicit types. Grain: one row per ticker."
    columns:
      - name: ticker
        description: "{{ doc('ticker_description') }}"
      - name: short_name
        description: "Company short name"
      - name: long_name
        description: "Full company name"
      - name: sector
        description: "Sector as classified by Yahoo Finance (not official GICS)"
      - name: industry
        description: "Industry as classified by Yahoo Finance"
      - name: country
        description: "Country of headquarters"
      - name: market_cap
        description: "Market capitalisation in USD at load time"
      - name: enterprise_value
        description: "Enterprise value in USD at load time"
      - name: recommendation_key
        description: "Analyst consensus recommendation"
      - name: _loaded_at
        description: "UTC timestamp of the load that wrote the row"

  - name: stg_financials
    description: "Quarterly income statement, deduplicated to the most recently loaded version of each quarter. Grain: one row per ticker per quarter_date."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, quarter_date]
    columns:
      - name: ticker
        description: "{{ doc('ticker_description') }}"
      - name: quarter_date
        description: "Fiscal quarter end date (renamed from date)"
      - name: total_revenue
        description: "Total revenue for the quarter"
      - name: gross_profit
        description: "Gross profit for the quarter (null for banks and insurers)"
      - name: operating_income
        description: "Operating income for the quarter"
      - name: net_income
        description: "Net income for the quarter"
      - name: ebitda
        description: "EBITDA for the quarter"
      - name: _loaded_at
        description: "UTC timestamp of the load that delivered this version of the quarter"
