models:
  - name: int_prices_with_returns
    description: "stg_prices plus the previous trading day's close and the daily return. Grain: one row per ticker per trading date."
    columns:
      - name: ticker
        description: "{{ doc('ticker_description') }}"
      - name: date
        description: "Trading date"
      - name: prev_close_price
        description: "Close of the previous trading day for the same ticker; null on the first day"
      - name: daily_return_pct
        description: "{{ doc('daily_return_description') }}"

  - name: int_prices_moving_averages
    description: "Daily prices and returns plus 20- and 50-day simple moving averages of the close. Grain: one row per ticker per trading date."
    columns:
      - name: ticker
        description: "{{ doc('ticker_description') }}"
      - name: date
        description: "Trading date"
      - name: sma_20
        description: "Average close over the last 20 trading days, rounded to 2 decimals; null until the ticker has 20 days of history"
      - name: sma_50
        description: "Average close over the last 50 trading days, rounded to 2 decimals; null until the ticker has 50 days of history"

  - name: int_financials_quarterly
    description: "Quarterly financials plus QoQ revenue growth and per-quarter margins. Grain: one row per ticker per quarter_date."
    columns:
      - name: ticker
        description: "{{ doc('ticker_description') }}"
      - name: quarter_date
        description: "Fiscal quarter end date"
      - name: revenue_growth_pct
        description: "Revenue change vs. the previous quarter, in percent. Null unless the previous row is 80-100 days earlier, so a gap in the data never produces a fake QoQ figure."
      - name: gross_margin_pct
        description: "gross_profit / total_revenue * 100 for this quarter. Null for banks and insurers (BAC, BRK-B, GS, JPM): yfinance reports no gross profit for them."
      - name: net_margin_pct
        description: "net_income / total_revenue * 100 for this quarter"
