name: dbt Daily Build

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6 AM UTC
  workflow_dispatch:  # Allow manual trigger

# Every dbt step does `cd finstack_dbt` first, so dbt finds dbt_project.yml
# and profiles.yml in its working directory. Do not also set DBT_PROJECT_DIR /
# DBT_PROFILES_DIR here: they are resolved relative to the cwd *after* the cd,
# which made dbt look for finstack_dbt/finstack_dbt and fail.

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          # protobuf<5: dbt-core 1.7 breaks on protobuf 5+ (MessageToJson signature change)
          pip install dbt-core==1.7.7 dbt-bigquery==1.7.7 "protobuf<5" yfinance google-cloud-bigquery pandas db-dtypes pyarrow

      - name: Create credentials file
        run: |
          mkdir -p credentials
          echo '${{ secrets.GCP_SA_JSON }}' > credentials/service_account.json

      - name: Create profiles.yml
        run: |
          cat > finstack_dbt/profiles.yml << EOF
          finstack_dbt:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: service-account
                database: finstack-analytics
                schema: finstack_raw
                keyfile: ../credentials/service_account.json
                location: EU
                threads: 4
          EOF

      - name: Load fresh data
        run: python scripts/load_yfinance.py

      - name: Install dbt packages
        run: cd finstack_dbt && dbt deps

      - name: Check source freshness
        run: cd finstack_dbt && dbt source freshness || true

      - name: Run dbt build
        run: cd finstack_dbt && dbt build

      - name: Upload manifest for Slim CI
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: finstack_dbt/target/manifest.json
          retention-days: 7