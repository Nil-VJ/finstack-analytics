name: dbt Slim CI

on:
  pull_request:
    branches: [main]

# Every dbt step does `cd finstack_dbt` first, so dbt finds dbt_project.yml
# and profiles.yml in its working directory. Do not also set DBT_PROJECT_DIR /
# DBT_PROFILES_DIR here: they are resolved relative to the cwd *after* the cd,
# which made dbt look for finstack_dbt/finstack_dbt and fail.

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: ci
      DBT_KEYFILE: ${{ github.workspace }}/credentials/service_account.json
      GCP_PROJECT_ID: finstack-analytics

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account key
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$GCP_SA_JSON" > credentials/service_account.json

      - name: Install dbt packages
        run: cd finstack_dbt && dbt deps

      - name: Download production manifest
        # The next step already falls back to a full build when manifest.json is
        # absent. continue-on-error covers the cases if_no_artifact_found doesn't:
        # e.g. the prod workflow not yet existing on main returns a hard 404.
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          name: prod-manifest
          path: finstack_dbt/prod-state
          workflow: prod_refresh.yml
          branch: main
          if_no_artifact_found: warn

      - name: Run dbt build (modified only)
        run: |
          cd finstack_dbt
          if [ -f prod-state/manifest.json ]; then
            dbt build --select state:modified+ --defer --state ./prod-state --fail-fast
          else
            echo "No production manifest found, running full build"
            dbt build --fail-fast
          fi
