name: dbt Slim CI

on:
  pull_request:
    branches: [main]

# Every dbt step does `cd finstack_dbt` first, so dbt finds dbt_project.yml
# and profiles.yml in its working directory. Do not also set DBT_PROJECT_DIR /
# DBT_PROFILES_DIR here: they are resolved relative to the cwd *after* the cd,
# which made dbt look for finstack_dbt/finstack_dbt and fail.

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          # protobuf<5: dbt-core 1.7 breaks on protobuf 5+ (MessageToJson signature change)
          pip install dbt-core==1.7.7 dbt-bigquery==1.7.7 "protobuf<5"

      - name: Create credentials file
        run: |
          mkdir -p credentials
          echo '${{ secrets.GCP_SA_JSON }}' > credentials/service_account.json

      - name: Create profiles.yml
        run: |
          cat > finstack_dbt/profiles.yml << EOF
          finstack_dbt:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                database: finstack-analytics
                schema: finstack_raw_ci
                keyfile: ../credentials/service_account.json
                location: EU
                threads: 4
          EOF

      - name: Install dbt packages
        run: cd finstack_dbt && dbt deps

      - name: Download production manifest
        # The next step already falls back to a full build when manifest.json is
        # absent. continue-on-error covers the cases if_no_artifact_found doesn't:
        # e.g. the daily workflow not yet existing on main returns a hard 404.
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          name: prod-manifest
          path: finstack_dbt/prod-state
          workflow: dbt_daily.yml
          branch: main
          if_no_artifact_found: warn

      - name: Run dbt build (modified only)
        run: |
          cd finstack_dbt
          if [ -f prod-state/manifest.json ]; then
            dbt build --select state:modified+ --defer --state ./prod-state --fail-fast
          else
            echo "No production manifest found, running full build"
            dbt build --fail-fast
          fi